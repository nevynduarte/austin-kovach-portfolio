<!doctype html><html lang="en"><meta charset="utf-8"><title>Local portfolio QA</title><style>body{font:14px system-ui;background:#eee}iframe{height:850px;border:0}pre{white-space:pre-wrap}button{margin:10px;padding:8px}</style><button id="mobile">390px mobile</button><button id="desktop">Desktop</button><button id="audit">Run accessibility audit</button><pre id="result">Ready</pre><iframe id="site" title="Portfolio preview" src="/?qa=1" width="1280"></iframe><script type="module">const f=document.querySelector('iframe');document.querySelector('#mobile').onclick=()=>f.width=390;document.querySelector('#desktop').onclick=()=>f.width=1280;document.querySelector('#audit').onclick=()=>{document.querySelector('#result').textContent='Running';f.contentWindow.postMessage('audit',location.origin);};window.addEventListener('message',e=>{if(e.origin===location.origin)document.querySelector('#result').textContent=JSON.stringify(e.data,null,2);});</script></html>
